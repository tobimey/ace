# Runs ace-audit, one job per domain. Each domain opens at most three tickets, labelled ace:needs-dev.
# Starts on a schedule for every domain in the list, or by hand for one domain.
# Written by ace-setup. Ace knows this workflow when who_starts_runs in ace/config.json is github-actions.
name: ace-audit

on:
  schedule:
    - cron: "<CRON>"
  workflow_dispatch:
    inputs:
      domain:
        description: The domain to audit
        type: choice
        options: [security, logic, performance, architecture, health]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    strategy:
      fail-fast: false
      # One domain at a time, so each one sees the tickets the one before it opened.
      max-parallel: 1
      matrix:
        domain: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.domain) || '<DOMAINS>') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      <AGENT_STEP>
